[project]
name = "apex-sdr-backend"
version = "0.1.0"
description = "FastAPI backend for ApexSDR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "arq>=0.25.0",
    "redis>=5.0.3",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "pytz>=2024.1",
    "alembic>=1.13.1",
    "google-generativeai>=0.4.1",
    "streamlit>=1.33.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
