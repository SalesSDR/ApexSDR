[project]
name = "apex-sdr-backend"
version = "0.1.0"
description = "FastAPI backend for ApexSDR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "arq>=0.25.0",
    "redis>=5.0.3",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "alembic>=1.13.1",
    "google-generativeai>=0.4.1",
    "resend>=0.7.1",
    "dnspython>=2.6.1",
    "twilio>=8.0.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "asgi-correlation-id>=4.3.1",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    # stdlib zoneinfo (used by services/compliance/policy.py for business-hours
    # gating) has no bundled tz database - it falls back to the OS's, which
    # Windows never has and slim Linux images aren't guaranteed to ship either.
    "tzdata>=2024.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
