# Minimal, explicit lint config (Sprint 8 RC hardening) - before this file
# existed, `ruff check` picked up whatever rules this ruff version enables
# implicitly, which is undocumented and changes across ruff releases (a
# reproducibility gap, same class of issue as pinning uv.lock). This pins
# a deliberately small, mechanical rule set: pyflakes/pycodestyle basics,
# import sorting, and pyupgrade modernization - all either already-fixed or
# safely auto-fixable across this codebase. Broader opinionated rule
# families (bare-except style, exception chaining, datetime-naivety,
# complexity/perf hints) are left for a deliberate follow-up decision
# rather than silently inherited from ruff's own defaults.
target-version = "py311"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-length is advisory here, not enforced as an error
    # SQLAlchemy's Column.__eq__ is overloaded to build SQL expressions -
    # `Column.is_active == True` / `Column.expires_at == None` are the
    # CORRECT, required idiom for building a WHERE clause (`is`/`not` would
    # evaluate as plain Python truthiness instead of generating SQL and
    # silently produce a wrong or unfiltered query). E711/E712 don't know
    # about this overload, so they'd misfire on the majority of this
    # codebase's actual query-construction code.
    "E711",
    "E712",
]

[lint.per-file-ignores]
"alembic/versions/*" = ["E501", "UP"]  # autogenerated, not hand-maintained
