services:
  - type: redis
    name: apex-sdr-redis
    plan: free # defaults to starter but you can use free for redis
    ipAllowList: []

  - type: web
    name: apex-sdr-api
    plan: free
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile.prod
    dockerCommand: "arq app.workers.tasks.WorkerSettings & gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: apex-sdr-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*" # You can update this to your Vercel URL later
