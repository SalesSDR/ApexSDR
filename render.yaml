databases:
  - name: apex-sdr-db
    databaseName: apex_sdr_prod
    user: sdr_admin
    plan: free

services:
  - type: redis
    name: apex-sdr-redis
    plan: free
    ipAllowList: []

  - type: web
    name: apex-sdr-api
    plan: free
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile.prod
    dockerCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-sdr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: apex-sdr-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*" # Update to your Vercel URL later

  - type: worker
    name: apex-sdr-worker
    plan: free
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile.prod
    dockerCommand: "arq app.workers.main.WorkerSettings"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-sdr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: apex-sdr-redis
          property: connectionString
