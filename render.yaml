databases:
  - name: apex-sdr-db
    databaseName: apex_sdr_prod
    user: sdr_admin
    plan: free

services:
  - type: redis
    name: apex-sdr-redis
    plan: free
    ipAllowList: []

  - type: web
    name: apex-sdr-api
    plan: free
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile.prod
    dockerCommand: "bash start.sh"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apex-sdr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: apex-sdr-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://apexsdr.com,https://www.apexsdr.com,https://app.apexsdr.com"
      - key: SECRET_KEY
        sync: false
      - key: UNIPILE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
      - key: UNIPILE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: USE_MOCK_CLIENTS
        value: "false"
